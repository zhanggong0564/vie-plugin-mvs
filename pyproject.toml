[build-system]
requires = ["setuptools>=61", "Cython>=3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vie-plugin-mvs"
version = "0.1.1"
description = "VIE 装箱清单物料检验插件"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "onnxruntime-gpu==1.20.1",
    "opencv-python-headless==4.11.0.86",
    "PyYAML>=6.0,<7",
    "vie-framework",
]

[project.entry-points."vie.plugins"]
mvs = "vie_plugin_mvs.plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["vie_plugin_mvs*"]

[tool.setuptools.package-data]
vie_plugin_mvs = ["rules.yaml"]
